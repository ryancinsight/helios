# Uncommitted Atlas audit-sweep Step 2 overlay: tighten workflow
# permissions to least-privilege so the scanned class drops.
permissions:
  contents: read

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt

      - name: Install Rust verification tools
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: cargo-nextest@0.9.140,cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --all-features --profile ci

      - name: Doctests
        run: cargo test --workspace --all-features --doc

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check book figures
        run: cargo run -p xtask -- check-figures

      - name: Install mdBook
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: mdbook@0.5.4

      - name: Test book documentation
        run: mdbook test docs/book

      - name: RustSec audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2021-0153

      - name: Dependency policy
        run: cargo deny check

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install binding verification tools
        run: python -m pip install maturin==1.14.1 pytest==9.1.1

      - name: Build Python extension
        working-directory: crates/helios-python
        run: python -m maturin build --release --out dist

      - name: Install Python extension
        working-directory: crates/helios-python
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Test Python extension
        working-directory: crates/helios-python
        run: python -m pytest tests -q

  benchmark-regression:
    name: benchmark regression check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Criterion 0.5 defaults to 3 s warm-up + 5 s measurement per ID. The
      # largest Helios binary has ten IDs (80 s modelled measurement time);
      # 300 s bounds initialization, slow iterations, and runner variance.
      BENCH_FULL_TIMEOUT_SECONDS: 300
      BENCH_SMOKE_TIMEOUT_SECONDS: 60
      BENCH_TIMEOUT_KILL_GRACE_SECONDS: 10
      BENCHMARK_TARGETS: |
        helios-analysis:dvh_queries
        helios-gpu:projection_throughput
        helios-gpu:transmission_throughput
        helios-solver:scatter_superposition
    steps:
      - name: Checkout baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: helios-baseline

      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: helios-candidate

      - name: Checkout Atlas benchmark gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ryancinsight/atlas
          ref: ceafa3d951f7db9ffcd93a79e5efbbdd09e199de
          path: atlas-tool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-helios-bench-${{ hashFiles('helios-candidate/Cargo.lock') }}

      - name: Normalize historical baseline lock
        # The baseline manifest predates the Gaia package-identity cutover.
        # Keep its historical source and code revision, but update the
        # dependency alias required by the provider checkout recorded in the
        # Atlas graph. This edits only the ephemeral baseline checkout.
        shell: bash
        run: |
          set -euo pipefail
          old='gaia = { git = "https://github.com/ryancinsight/gaia", default-features = false }'
          new='gaia = { package = "gaia-mesh", git = "https://github.com/ryancinsight/gaia", default-features = false }'
          manifest=helios-baseline/Cargo.toml
          if grep --fixed-strings --quiet "$old" "$manifest"; then
            sed --in-place "s#${old}#${new}#" "$manifest"
          elif grep --fixed-strings --quiet 'gaia = { package = "gaia-mesh"' "$manifest" \
              && grep --fixed-strings --quiet 'git = "https://github.com/ryancinsight/gaia"' "$manifest"; then
            # The baseline may already include the package identity together
            # with a version requirement; that shape needs no rewrite.
            :
          else
            echo "historical baseline Gaia dependency has an unexpected shape" >&2
            exit 1
          fi

          cargo metadata \
            --manifest-path helios-baseline/Cargo.toml \
            --format-version 1 \
            --all-features > /dev/null

      - name: Normalize candidate lock
        # The committed candidate lock records git sources; the benchmark gate
        # materializes path providers, so regenerate the ephemeral candidate
        # lock against the materialized graph before locked builds.
        run: >-
          cargo metadata
          --manifest-path helios-candidate/Cargo.toml
          --format-version 1
          --all-features
          > /dev/null

      - name: Hold the candidate benchmark instrument constant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            helios-baseline/crates/helios-analysis/benches \
            helios-baseline/crates/helios-gpu/benches \
            helios-baseline/crates/helios-solver/benches
          git -C helios-candidate archive HEAD \
            crates/helios-analysis/benches \
            crates/helios-gpu/benches \
            crates/helios-solver/benches \
            | tar -x -C helios-baseline
          for crate in helios-analysis helios-gpu helios-solver; do
            diff --recursive --unified \
              "helios-baseline/crates/$crate/benches" \
              "helios-candidate/crates/$crate/benches"
          done

      - name: Compile benchmark binaries outside runtime budgets
        shell: bash
        run: |
          set -euo pipefail

          for revision in helios-candidate helios-baseline; do
            while IFS=: read -r package benchmark; do
              [[ -n "$package" ]] || continue
              cargo bench \
                --manifest-path "$revision/Cargo.toml" \
                --all-features \
                --package "$package" \
                --bench "$benchmark" \
                --locked \
                --no-run
            done <<<"$BENCHMARK_TARGETS"
          done

      - name: Smoke and measure phase-reversed replications
        shell: bash
        run: |
          set -euo pipefail
          confidence=""
          gate_manifest="atlas-tool/tools/criterion-regression/Cargo.toml"

          run_benches() {
            local revision="$1"
            local budget_seconds="$2"
            shift 2

            while IFS=: read -r package benchmark; do
              [[ -n "$package" ]] || continue
              echo "::group::$revision $package/$benchmark (${budget_seconds}s budget)"
              timeout \
                --foreground \
                --kill-after="${BENCH_TIMEOUT_KILL_GRACE_SECONDS}s" \
                "${budget_seconds}s" \
                cargo bench \
                  --manifest-path "$revision/Cargo.toml" \
                  --all-features \
                  --package "$package" \
                  --bench "$benchmark" \
                  --locked \
                  -- \
                  "$@"
              echo "::endgroup::"
            done <<<"$BENCHMARK_TARGETS"
          }

          # Criterion test mode executes every benchmark ID exactly once. The
          # same suite list drives smoke and full runs, so new binaries cannot
          # enter regression measurement without the 60 s smoke gate.
          run_benches \
            helios-candidate \
            "$BENCH_SMOKE_TIMEOUT_SECONDS" \
            --test

          compare_pair() {
            local report_root="$1"
            local first_revision="$2"
            local second_revision="$3"

            rm -rf "$CARGO_TARGET_DIR/criterion"
            run_benches \
              "$first_revision" \
              "$BENCH_FULL_TIMEOUT_SECONDS" \
              --save-baseline atlas-base

            if [[ -z "$confidence" ]]; then
              confidence="$(
                cargo run \
                  --manifest-path "$gate_manifest" \
                  --locked \
                  -- \
                  required-confidence \
                  --criterion-root "$CARGO_TARGET_DIR/criterion" \
                  --baseline atlas-base
              )"
            fi

            run_benches \
              "$second_revision" \
              "$BENCH_FULL_TIMEOUT_SECONDS" \
              --baseline atlas-base \
              --confidence-level "$confidence"

            mkdir -p "$(dirname "$report_root")"
            mv "$CARGO_TARGET_DIR/criterion" "$report_root"
          }

          compare_pair \
            reports/first/baseline-first \
            helios-baseline \
            helios-candidate
          compare_pair \
            reports/first/candidate-first \
            helios-candidate \
            helios-baseline
          compare_pair \
            reports/second/candidate-first \
            helios-candidate \
            helios-baseline
          compare_pair \
            reports/second/baseline-first \
            helios-baseline \
            helios-candidate

      - name: Classify replicated comparisons
        run: >-
          cargo run
          --manifest-path atlas-tool/tools/criterion-regression/Cargo.toml
          --locked
          --
          check-replicated-counterbalanced
          --first-baseline-first-root reports/first/baseline-first
          --first-candidate-first-root reports/first/candidate-first
          --second-baseline-first-root reports/second/baseline-first
          --second-candidate-first-root reports/second/candidate-first
          --baseline atlas-base
