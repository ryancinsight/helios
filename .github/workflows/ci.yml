# Uncommitted Atlas audit-sweep Step 2 overlay: tighten workflow
# permissions to least-privilege so the scanned class drops.
permissions:
  contents: read

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Superseded runs cancel rather than queue. Without this, every force-push
# or rapid commit series on one branch accumulated a full three-job pipeline
# per push; helios runs have repeatedly shown multi-minute-to-hour gaps
# between run creation and first job start while superseded pipelines held
# queue positions (e.g. run 32436531185: 92 queued minutes for 5.7 minutes
# of compute; run 32892598325's book deploy waited 57 minutes to publish a
# 2.6-minute build).
concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@da9d549bc50dbb9c4e1d18dca8f37d17059098cb
    with:
      package: helios-analysis,helios-core,helios-domain,helios-gpu,helios-imaging,helios-math,helios-physics,helios-planning,helios-python,helios-simulation,helios-solver
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  fast-lint:
    name: fast lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt

      - name: Install verification tools
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: helios
          save-if: false

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: RustSec audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2021-0153

      - name: Dependency policy
        run: cargo deny check

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install nextest
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: cargo-nextest@0.9.140

      # Shared cache; only the tests job writes (it produces the most
      # dependency artifacts). Other jobs restore with save-if: false.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: helios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests
        run: cargo nextest run --workspace --all-features --profile ci

      - name: Doctests
        run: cargo test --workspace --all-features --doc

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: helios
          save-if: false

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check book figures
        run: cargo run -p xtask -- check-figures

      - name: Install mdBook
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649
        with:
          tool: mdbook@0.5.4

      - name: Test book documentation
        run: mdbook test docs/book

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install binding verification tools
        run: python -m pip install maturin==1.14.1 pytest==9.1.1

      - name: Build Python extension
        working-directory: crates/helios-python
        run: python -m maturin build --release --out dist

      - name: Install Python extension
        working-directory: crates/helios-python
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Test Python extension
        working-directory: crates/helios-python
        run: python -m pytest tests -q

  bench-smoke:
    # ADR 0003 (revision 2026-09-21): benchmarks are a local instrument.
    # Shared-runner wall-clock timings are noise, not evidence, so CI never
    # classifies performance and the hosted `benchmark-regression` timing
    # gate is deleted. CI keeps only this single-iteration smoke: Criterion
    # test mode executes every benchmark ID exactly once inside a committed
    # per-target budget, proving benches build and run. Timing evidence
    # arrives as PR-attached local reports from `cargo xtask bench-replicated`.
    name: benchmark smoke
    runs-on: ubuntu-latest
    # Tests-job parity: the ceiling covers cold-cache bench compilation;
    # per-target 120 s smoke bounds still apply inside it.
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Criterion test mode executes every benchmark ID exactly once. The
      # same target list drives smoke and local full runs, so new binaries
      # cannot enter local regression measurement unsmoked. The 120 s
      # per-target bound derives from a measured 71 s single-iteration sweep
      # of the slowest target (`projection_throughput`, 4 IDs) on the
      # calibration host, with headroom for slower shared runners.
      BENCH_SMOKE_TIMEOUT_SECONDS: 120
      BENCH_TIMEOUT_KILL_GRACE_SECONDS: 10
      BENCHMARK_TARGETS: |
        helios-analysis:dvh_queries
        helios-gpu:projection_throughput
        helios-gpu:transmission_throughput
        helios-solver:scatter_superposition
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: helios
          save-if: false

      - name: Benchmark smoke (single iteration per benchmark ID)
        shell: bash
        run: |
          set -euo pipefail
          while IFS=: read -r package benchmark; do
            [[ -n "$package" ]] || continue
            echo "::group::$package/$benchmark (${BENCH_SMOKE_TIMEOUT_SECONDS}s budget)"
            timeout \
              --foreground \
              --kill-after="${BENCH_TIMEOUT_KILL_GRACE_SECONDS}s" \
              "${BENCH_SMOKE_TIMEOUT_SECONDS}s" \
              cargo bench \
                --all-features \
                --package "$package" \
                --bench "$benchmark" \
                -- \
                --test
            echo "::endgroup::"
          done <<<"$BENCHMARK_TARGETS"
