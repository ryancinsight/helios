name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action. The
    # shared workflow keeps pull-request builds separate from deployment.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/helios/html
      # book.toml declares the optional linkcheck2 backend; install the exact
      # renderer so local links are checked in the same build as the HTML.
      mdbook-linkcheck2-version: "0.12.2"
