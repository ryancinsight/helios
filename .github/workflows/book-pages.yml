name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action. The
    # shared workflow keeps pull-request builds separate from deployment.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@578150340157c6da25f4ee2b37d6b4639d787c1a
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/helios/html
