[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "helios-python"
dynamic = ["version"]
description = "Thin PyO3 bindings for the Helios radiation-therapy simulation/imaging stack"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ryan Clanton", email = "ryanclanton@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["radiotherapy", "medical-imaging", "dosimetry", "simulation", "pyo3"]

[project.urls]
Homepage = "https://ryancinsight.github.io/helios/"
Repository = "https://github.com/ryancinsight/helios"
Documentation = "https://ryancinsight.github.io/helios/"

[tool.maturin]
# The extension links the stable ABI (abi3-py39), so one wheel serves CPython
# ≥3.9. manifest-path is relative to this file (the crate root).
manifest-path = "Cargo.toml"
module-name = "helios"
features = []
