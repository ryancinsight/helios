[package]
name = "helios-gpu"
description = "Helios GPU compute layer: dispatch over the hephaestus ComputeDevice/wgpu backend for imaging and dose kernels."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aequitas = { workspace = true }
eunomia = { workspace = true }
helios-quantities = { workspace = true }
helios-domain = { workspace = true }
helios-math = { workspace = true }
hephaestus-core = { workspace = true }
hephaestus-wgpu = { workspace = true }
leto = { workspace = true }
themis = { workspace = true }

[dev-dependencies]
# Examples and benches install the program allocator (ADR 0018).
helios-allocator = { workspace = true }
aequitas = { workspace = true }
# Differential references for the GPU projector / attenuation tests only.
helios-solver = { workspace = true }
hyperion = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "transmission_throughput"
harness = false

[[bench]]
name = "projection_throughput"
harness = false
