[package]
name = "helios-analysis"
description = "Helios dosimetric analysis: dose-volume histograms and the gamma index (dose-difference / distance-to-agreement) for plan/measurement comparison."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aequitas = { workspace = true }
asclepius = { workspace = true }
eunomia = { workspace = true }
helios-quantities = { workspace = true }
helios-math = { workspace = true, features = ["geometry"] }
helios-domain = { workspace = true }

[dev-dependencies]
# Examples and benches install the program allocator (ADR 0018).
helios-allocator = { workspace = true }
criterion = { workspace = true }
# Keep workspace integration coverage without a published dev-dependency cycle.
helios-imaging = { path = "../helios-imaging" }

[[bench]]
name = "dvh_queries"
harness = false
