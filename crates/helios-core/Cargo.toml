[package]
name = "helios-core"
description = "Helios foundation layer: typed errors, physical constants, and validating domain newtypes for radiation therapy and imaging."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["mnemosyne-memory"]
# Adopt the Atlas memory subsystem -- the `Mnemosyne` global allocator and its
# thread-local scratch pools -- as the workspace allocation package. Default-on so
# every Helios binary that links `helios-core` shares one allocator; disable it
# only for a leaf that must not link Mnemosyne.
mnemosyne-memory = ["dep:mnemosyne"]

[dependencies]
aequitas = { workspace = true }
mnemosyne = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
eunomia = { workspace = true }
proptest = { workspace = true }
