[advisories]
ignore = ["RUSTSEC-2021-0153"]

[licenses]
confidence-threshold = 0.8
# BSD-3-Clause: subtle via rustls trust stack, pulled in by moirai-quic via
# moirai-runtime 0.11.3. Same allowance the Moirai provider's own deny.toml
# carries; OSI-approved and FSF Free/Libre.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "IJG",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["ryancinsight"]
